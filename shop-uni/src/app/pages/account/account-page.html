<div class="container">
  <h1>{{ mode() === 'login' ? 'Sign in' : 'Create account' }}</h1>
  <p class="subtitle">Use your email and password</p>

  <form class="form" (ngSubmit)="submit()">
    <label>
      Email
      <input type="email" name="email" required [(ngModel)]="email" />
    </label>
    <label>
      Password
      <input type="password" name="password" required minlength="6" [(ngModel)]="password" />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button type="submit" [disabled]="pending()">
      {{ mode() === 'login' ? 'Sign in' : 'Register' }}
    </button>
  </form>

  <button type="button" class="switch" (click)="mode.set(mode() === 'login' ? 'register' : 'login')">
    {{ mode() === 'login' ? 'Need an account? Register' : 'Already registered? Sign in' }}
  </button>
</div>
