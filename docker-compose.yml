services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Redis__ConnectionString: redis:6379
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__Key: ${JWT_KEY}
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}
      Antiforgery__SameSite: ${ANTIFORGERY_SAMESITE}
      Supabase__Url: ${SUPABASE_URL}
      Supabase__PublicUrl: ${SUPABASE_PUBLIC_URL}
      Supabase__ServiceRoleKey: ${SUPABASE_SERVICE_ROLE_KEY}
      Supabase__Bucket: ${SUPABASE_BUCKET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      storage:
        condition: service_started

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    build:
      context: ./storage
    environment:
      SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OBJECT_PREFIX: ${SUPABASE_OBJECT_PREFIX}
      PUBLIC_PREFIX: ${SUPABASE_PUBLIC_PREFIX}
    ports:
      - "54321:5000"
    volumes:
      - storage_data:/data

  frontend:
    build:
      context: ./shop-uni
      dockerfile: Dockerfile
    environment:
      API_URL: ${FRONTEND_API_URL:-/api}
      API_PROXY: ${FRONTEND_API_PROXY:-http://app:8080}
    ports:
      - "4200:80"
    depends_on:
      - app

volumes:
  postgres_data:
  storage_data:
